<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Sidebar — Component Reference</title>
<link rel="stylesheet" href="../tokens/design-tokens.css">
<style>
  body { background: var(--color-bg-subtle); padding: 2rem; font-family: var(--font-body); }

  .filter-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* =====================
     Filter Sidebar
  ===================== */
  .filter-sidebar {
    background: var(--color-bg);
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
    padding: var(--space-5);
    height: fit-content;
    position: sticky;
    top: var(--space-4);
  }

  .filter-sidebar__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-5);
    padding-bottom: var(--space-4);
    border-bottom: 1px solid var(--color-border);
  }

  .filter-sidebar__title {
    font-size: var(--text-base);
    font-weight: var(--font-weight-semibold);
    margin: 0;
  }

  .filter-clear-all {
    font-size: var(--text-xs);
    color: var(--color-brand-accent);
    background: none;
    border: none;
    cursor: pointer;
    font-weight: var(--font-weight-semibold);
    text-decoration: underline;
    padding: 0;
  }

  /* Active Filters Pills */
  .active-filters {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-bottom: var(--space-5);
  }

  .filter-pill {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    padding: 4px var(--space-3);
    background: var(--color-brand-primary);
    color: white;
    border-radius: var(--radius-full);
    font-size: var(--text-xs);
    font-weight: var(--font-weight-medium);
  }

  .filter-pill__remove {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    padding: 0;
    font-size: 0.75rem;
    line-height: 1;
    margin-left: 2px;
  }
  .filter-pill__remove:hover { color: white; }

  /* Filter Group */
  .filter-group {
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-4) 0;
  }
  .filter-group:last-child { border-bottom: none; padding-bottom: 0; }

  .filter-group__toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    width: 100%;
    text-align: left;
    font-size: var(--text-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--color-text-primary);
    margin-bottom: var(--space-3);
  }

  .filter-group__chevron {
    transition: transform var(--transition-fast);
    font-size: 0.7rem;
    color: var(--color-text-muted);
  }
  .filter-group--collapsed .filter-group__chevron { transform: rotate(-90deg); }

  .filter-group__content {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  /* Checkbox Filter Item */
  .filter-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    cursor: pointer;
  }

  .filter-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--color-brand-primary);
    cursor: pointer;
    flex-shrink: 0;
  }

  .filter-item__label {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    flex: 1;
    cursor: pointer;
  }

  .filter-item__count {
    font-size: var(--text-xs);
    color: var(--color-text-muted);
  }

  /* Color Swatch Filter */
  .color-filters {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .color-filter {
    position: relative;
    cursor: pointer;
  }

  .color-filter input { position: absolute; opacity: 0; width: 0; height: 0; }

  .color-filter__swatch {
    display: block;
    width: 28px;
    height: 28px;
    border-radius: var(--radius-full);
    border: 2px solid transparent;
    transition: border-color var(--transition-fast);
    outline-offset: 3px;
  }

  .color-filter input:checked + .color-filter__swatch {
    border-color: var(--color-brand-primary);
    outline: 2px solid var(--color-brand-primary);
  }

  .color-filter__swatch:hover { border-color: var(--color-border-strong); }

  /* Size Filter */
  .size-filters {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .size-filter {
    position: relative;
    cursor: pointer;
  }
  .size-filter input { position: absolute; opacity: 0; width: 0; height: 0; }

  .size-filter__label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 36px;
    padding: 0 var(--space-2);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: var(--text-xs);
    font-weight: var(--font-weight-medium);
    cursor: pointer;
    transition: all var(--transition-fast);
    color: var(--color-text-secondary);
  }

  .size-filter__label:hover {
    border-color: var(--color-brand-primary);
    color: var(--color-text-primary);
  }

  .size-filter input:checked + .size-filter__label {
    background: var(--color-brand-primary);
    border-color: var(--color-brand-primary);
    color: white;
  }

  .size-filter--unavailable .size-filter__label {
    opacity: 0.4;
    cursor: not-allowed;
    text-decoration: line-through;
  }

  /* Price Range */
  .price-range {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .price-range__inputs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: var(--space-2);
    align-items: center;
  }

  .price-range__input {
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    color: var(--color-text-primary);
    font-family: var(--font-body);
  }

  .price-range__input:focus {
    outline: none;
    border-color: var(--color-brand-primary);
  }

  .price-range__separator { color: var(--color-text-muted); font-size: var(--text-sm); text-align: center; }

  /* Rating Filter */
  .rating-filter {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    cursor: pointer;
    padding: var(--space-1) 0;
  }
  .rating-filter input { accent-color: var(--color-brand-primary); cursor: pointer; }
  .rating-filter__stars { color: var(--color-star-filled); font-size: var(--text-sm); }
  .rating-filter__label { font-size: var(--text-sm); color: var(--color-text-secondary); }
  .rating-filter__label span { color: var(--color-text-muted); }

  /* Results Bar */
  .results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--color-bg);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
    margin-bottom: var(--space-4);
  }

  .results-count {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
  }

  .sort-select {
    padding: var(--space-2) var(--space-4);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    background: white;
    color: var(--color-text-primary);
    cursor: pointer;
    font-family: var(--font-body);
  }
  .sort-select:focus { outline: none; border-color: var(--color-brand-primary); }
</style>
</head>
<body>

<div class="filter-layout">

  <!-- Filter Sidebar -->
  <aside class="filter-sidebar" aria-label="Product filters">
    <div class="filter-sidebar__header">
      <h2 class="filter-sidebar__title">Filters</h2>
      <button class="filter-clear-all">Clear all</button>
    </div>

    <!-- Active Filter Pills -->
    <div class="active-filters" role="list" aria-label="Active filters">
      <div class="filter-pill" role="listitem">
        Blue
        <button class="filter-pill__remove" aria-label="Remove Blue filter">✕</button>
      </div>
      <div class="filter-pill" role="listitem">
        Under $100
        <button class="filter-pill__remove" aria-label="Remove price filter">✕</button>
      </div>
    </div>

    <!-- Category -->
    <div class="filter-group">
      <button class="filter-group__toggle" aria-expanded="true">
        Category <span class="filter-group__chevron">▼</span>
      </button>
      <div class="filter-group__content">
        <label class="filter-item"><input type="checkbox" checked> <span class="filter-item__label">Tops</span> <span class="filter-item__count">48</span></label>
        <label class="filter-item"><input type="checkbox"> <span class="filter-item__label">Bottoms</span> <span class="filter-item__count">32</span></label>
        <label class="filter-item"><input type="checkbox"> <span class="filter-item__label">Outerwear</span> <span class="filter-item__count">19</span></label>
        <label class="filter-item"><input type="checkbox"> <span class="filter-item__label">Accessories</span> <span class="filter-item__count">61</span></label>
      </div>
    </div>

    <!-- Color -->
    <div class="filter-group">
      <button class="filter-group__toggle" aria-expanded="true">
        Color <span class="filter-group__chevron">▼</span>
      </button>
      <div class="color-filters" role="group" aria-label="Filter by color">
        <label class="color-filter" title="Black">
          <input type="checkbox">
          <span class="color-filter__swatch" style="background:#1a1a1a;"></span>
        </label>
        <label class="color-filter" title="White">
          <input type="checkbox">
          <span class="color-filter__swatch" style="background:#f5f5f5; border: 1px solid #ddd;"></span>
        </label>
        <label class="color-filter" title="Navy">
          <input type="checkbox" checked>
          <span class="color-filter__swatch" style="background:#1e3a5f;"></span>
        </label>
        <label class="color-filter" title="Camel">
          <input type="checkbox">
          <span class="color-filter__swatch" style="background:#c19a6b;"></span>
        </label>
        <label class="color-filter" title="Sage">
          <input type="checkbox">
          <span class="color-filter__swatch" style="background:#87a086;"></span>
        </label>
        <label class="color-filter" title="Terracotta">
          <input type="checkbox">
          <span class="color-filter__swatch" style="background:#c17a5a;"></span>
        </label>
      </div>
    </div>

    <!-- Size -->
    <div class="filter-group">
      <button class="filter-group__toggle" aria-expanded="true">
        Size <span class="filter-group__chevron">▼</span>
      </button>
      <div class="size-filters" role="group" aria-label="Filter by size">
        <label class="size-filter size-filter--unavailable"><input type="checkbox" disabled><span class="size-filter__label">XS</span></label>
        <label class="size-filter"><input type="checkbox"><span class="size-filter__label">S</span></label>
        <label class="size-filter"><input type="checkbox" checked><span class="size-filter__label">M</span></label>
        <label class="size-filter"><input type="checkbox"><span class="size-filter__label">L</span></label>
        <label class="size-filter"><input type="checkbox"><span class="size-filter__label">XL</span></label>
        <label class="size-filter"><input type="checkbox"><span class="size-filter__label">XXL</span></label>
      </div>
    </div>

    <!-- Price Range -->
    <div class="filter-group">
      <button class="filter-group__toggle" aria-expanded="true">
        Price <span class="filter-group__chevron">▼</span>
      </button>
      <div class="price-range">
        <div class="price-range__inputs">
          <input class="price-range__input" type="number" placeholder="Min" aria-label="Minimum price" value="0">
          <span class="price-range__separator">–</span>
          <input class="price-range__input" type="number" placeholder="Max" aria-label="Maximum price" value="100">
        </div>
        <button class="btn btn--sm btn--outline btn--full">Apply</button>
      </div>
    </div>

    <!-- Rating -->
    <div class="filter-group">
      <button class="filter-group__toggle" aria-expanded="true">
        Rating <span class="filter-group__chevron">▼</span>
      </button>
      <div class="filter-group__content">
        <label class="rating-filter"><input type="radio" name="rating" value="4"> <span class="rating-filter__stars">★★★★☆</span> <span class="rating-filter__label">4+ <span>(212)</span></span></label>
        <label class="rating-filter"><input type="radio" name="rating" value="3"> <span class="rating-filter__stars">★★★☆☆</span> <span class="rating-filter__label">3+ <span>(289)</span></span></label>
        <label class="rating-filter"><input type="radio" name="rating" value="2"> <span class="rating-filter__stars">★★☆☆☆</span> <span class="rating-filter__label">2+ <span>(301)</span></span></label>
      </div>
    </div>

  </aside>

  <!-- Results Area (placeholder) -->
  <div>
    <div class="results-bar">
      <span class="results-count">Showing <strong>48</strong> of 148 products</span>
      <select class="sort-select" aria-label="Sort products">
        <option>Sort: Featured</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
        <option>Newest First</option>
        <option>Best Sellers</option>
        <option>Top Rated</option>
      </select>
    </div>
    <div style="background: var(--color-bg); border-radius: var(--radius-lg); border: 1px solid var(--color-border); height: 400px; display:flex; align-items:center; justify-content:center; color: var(--color-text-muted);">
      Product grid goes here
    </div>
  </div>

</div>

</body>
</html>
