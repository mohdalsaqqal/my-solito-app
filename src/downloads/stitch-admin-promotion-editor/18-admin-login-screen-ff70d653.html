<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Real Cosmetics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#000000", "background-light": "#f7f7f7", "background-dark": "#191919"}, fontFamily: {display: "Inter"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<div class="flex-1 flex flex-col items-center justify-center p-6">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 rounded-lg p-8 md:p-10">
<!-- Logo & Header -->
<div class="flex flex-col items-center mb-8">
<div class="size-12 bg-primary/10 rounded-lg flex items-center justify-center mb-4">
<svg class="text-primary size-8" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M39.5563 34.1455V13.8546C39.5563 15.708 36.8773 17.3437 32.7927 18.3189C30.2914 18.916 27.263 19.2655 24 19.2655C20.737 19.2655 17.7086 18.916 15.2073 18.3189C11.1227 17.3437 8.44365 15.708 8.44365 13.8546V34.1455C8.44365 35.9988 11.1227 37.6346 15.2073 38.6098C17.7086 39.2069 20.737 39.5564 24 39.5564C27.263 39.5564 30.2914 39.2069 32.7927 38.6098C36.8773 37.6346 39.5563 35.9988 39.5563 34.1455Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Real Cosmetics</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Administrative Access Control</p>
</div>
<!-- Login Form -->
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="email">Email Address</label>
<input class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none placeholder:text-slate-400" id="email" name="email" placeholder="admin@realcosmetics.com" type="email"/>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-12 pl-4 pr-11 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none placeholder:text-slate-400" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 py-1">
<input class="size-4 rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400" for="remember">Remember this device</label>
</div>
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2" type="submit">
                    Sign in to Dashboard
                </button>
</form>
<!-- Support Link -->
<div class="mt-8 text-center">
<p class="text-xs text-slate-500 dark:text-slate-500">
                    Having trouble logging in? <a class="text-primary font-medium hover:underline" href="#">Contact System Support</a>
</p>
</div>
</div>
<!-- Environment Indicator -->
<div class="mt-8 flex items-center gap-2 px-3 py-1.5 bg-slate-200/50 dark:bg-slate-800/50 rounded-full border border-slate-300/50 dark:border-slate-700/50">
<span class="size-2 rounded-full bg-emerald-500"></span>
<span class="text-[10px] uppercase tracking-wider font-bold text-slate-600 dark:text-slate-400">Production Environment</span>
</div>
</div>
<!-- Footer -->
<footer class="p-6 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600">
            © 2024 Real Cosmetics Inc. All rights reserved. Professional Admin Interface v2.4.0
        </p>
</footer>
</body></html>
